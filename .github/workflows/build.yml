name: Build macOS app

# Every push: build, sign, notarize, run the checks and render screenshots.
# The app is available as a download under the run (Actions tab).
# Publishing a release: the same, and the zip is attached to the release.
on:
  push:
    branches: ["**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      NOTARIZE: "1"
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check translations
        run: python3 tests/check_strings.py

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$ID" ]; then echo "No 'Developer ID Application' certificate in MACOS_CERT_P12"; exit 1; fi
          echo "CODESIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: ./build_app.sh

      - name: Run checks and render screenshots
        run: tests/run_checks.sh

      - name: Zip app
        run: ditto -c -k --keepParent "dist/Present Perfect.app" Present-Perfect-macOS.zip

      - name: Upload app
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Present-Perfect-macOS
          path: Present-Perfect-macOS.zip

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            tests/out/screenshots
            tests/out/diagnostics.txt
          if-no-files-found: ignore

      - name: Keep screenshots on a hidden ref for review
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          dir="$(mktemp -d)"
          cp -R tests/out/screenshots tests/out/diagnostics.txt "$dir/"
          cd "$dir"
          git init -q
          git add -A
          git -c user.name="Build" -c user.email="build@users.noreply.github.com" commit -q -m "Screenshots of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/screenshots

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: Present-Perfect-macOS.zip

      - name: Remove temporary keychain
        if: always() && env.MACOS_CERT_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
